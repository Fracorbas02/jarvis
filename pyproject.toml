[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis — assistant local (LLM local + outils MCP, voix à venir)"
requires-python = ">=3.11"
dependencies = [
    "bleach>=6.4.0",
    "httpx>=0.27",
    "linkify-it-py>=2.2.0",
    "markdown-it-py[plugins]>=4.2.0",
    "matplotlib>=3.11.2",
    "mcp>=2.3,<3",
    "prompt-toolkit>=3.0.53",
    "rich>=15.0.0",
]

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-app = "jarvis.gtk.app:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]
