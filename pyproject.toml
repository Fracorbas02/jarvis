[project]
name = "jarvis"
version = "0.1.0"
description = "Jarvis — assistant local (LLM local + outils MCP, voix à venir)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.3,<3",
]

[project.scripts]
jarvis = "jarvis.cli:main"

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jarvis"]
