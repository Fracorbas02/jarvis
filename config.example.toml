# Configuration Jarvis — copier en config.toml et ajuster

[llm]
# llama-server (API OpenAI-compatible). Port par défaut 9931 depuis llama.cpp v0.7.0.
base_url = "http://127.0.0.1:9931/v1"
# Le nom n'est qu'une étiquette pour llama-server ; il n'affecte pas le modèle chargé.
model = "qwen3.6-35b-a3b"
api_key = "local"          # llama-server accepte n'importe quoi en mode local
temperature = 0.3
max_tokens = 4096
timeout = 300.0             # premier chargement + prompt processing peuvent être longs
# Le thinking est gardé : le CLI streame le raisonnement en direct (grisé)
# pendant la génération. Pour le couper au profit de la latence pure :
# chat_template_kwargs = { enable_thinking = false }

[agent]
system_prompt = """Tu es Jarvis, l'assistant local de Bastien, ingénieur réseau et infrastructure.
Réponds en français, de façon directe et technique. Utilise les outils disponibles
quand c'est pertinent plutôt que de deviner ; cite ce que les outils te retournent.
Pour la veille CVE : « récentes » signifie les derniers jours/mois — passe days à
search_cve au lieu de chercher sans fenêtre de date."""

# Voix locale : deux serveurs indépendants du llama-server principal.
# S'ils ne répondent pas, l'app les lance elle-même avec le GGUF indiqué
# (modèle en chemin relatif à ~/models ou absolu).

[voice.stt]
binary = "whisper-server"                      # binaire whisper.cpp (examples/server)
base_url = "http://127.0.0.1:8178"
model = "~/models/stt/Q4_K_M.gguf"              # ggml whisper (ex. ggml-large-v3)
# protocol = "whisper"                          # défaut : whisper-server, POST /inference
# protocol = "voxtral"                          # llama-server + modèle audio llama.cpp
#                                               # (ex. Voxtral Mini 4B Realtime), sert
#                                               # POST /v1/audio/transcriptions ; dans ce cas
#                                               # binary = "llama-server" et model = le GGUF
#                                               # texte (mistral3). Voxtral Realtime a aussi
#                                               # besoin de son mmproj (encodeur audio) :
#                                               # s'il est dans le même dossier que le modèle
#                                               # (mmproj*.gguf), il est ajouté automatiquement
#                                               # en --mmproj ; sinon extra_args ci-dessous.
# extra_args = ["--mmproj", "~/models/stt/mmproj-Voxtral-Mini-4B-Realtime-2602-BF16.gguf"]
# extra_args = ["-ngl", "99"]                   # ex. offload GPU whisper.cpp
# device = "Vulkan1"                            # nom ggml (llama-server --list-devices) pour --device, ex. pour répartir les modèles sur plusieurs GPU (sinon choix global de l'onglet Réglages, sinon le 1er trouvé)
# env = { "CUDA_VISIBLE_DEVICES" = "1" }        # ou HIP_VISIBLE_DEVICES / ROCR_VISIBLE_DEVICES

[voice.tts]
binary = "llama-server"                         # sert POST /v1/audio/speech et /tts
base_url = "http://127.0.0.1:9932"
model = "~/models/tts/voxtral-4b-tts-q4_k.gguf"
# extra_args = ["-ngl", "99", "--jinja", "-fa", "on"]
# device = "Vulkan0"                            # nom ggml pour --device (répartition multi-GPU, sinon choix global Réglages)
# env = { "CUDA_VISIBLE_DEVICES" = "1" }

# TTS via l'API Mistral (Voxtral) au lieu du serveur local llama-server.
# Utilisé quand "Lire les réponses à voix haute" est activé dans l'app :
# si enabled=true et qu'une clé est enregistrée (Réglages > Voix API,
# ou export MISTRAL_API_KEY), les réponses passent par l'API Mistral ;
# sinon on retombe sur le serveur TTS local ci-dessus.
#   POST {base_url}/v1/audio/speech  {"model", "input", "voice_id", "response_format"}
#   GET  {base_url}/v1/audio/voices   (liste des voix preset + workspace)
# Modèles : voxtral-mini-tts-2603 (rapide, recommandé), voxtral-tts-2603 (qualité max).
# Voix preset : voice_592 (Marie, FR), voice_3137 (Manon, FR), gb_jane_neutral (EN-GB),
# en_paul_neutral (EN-US), voice_481 (Heidi, DE)... ou une voix clonée de ton workspace.
# La clé API n'est PAS dans ce fichier : ~/.config/jarvis/mistral.json (chmod 600).
# [voice.tts_api]
# enabled = true
# base_url = "https://api.mistral.ai"
# model = "voxtral-mini-tts-2603"
# voice_id = "voice_592"          # Marie, français
# response_format = "mp3"         # mp3 | wav | pcm | flac | opus

# Enregistrement micro (CLI) et lecture des WAV produits.
# "-" en dernier élément de record_cmd = le binaire écrit sur stdout (PCM s16le
# pour ffmpeg, WAV pour arecord sans -t raw) ; sinon c'est le chemin du WAV.
# arecord absent -> fallback automatique sur ffmpeg (-f alsa -i default).
# Pour forcer une source micro précise (PipeWire), ex. :
#   pactl list short sources | grep alsa_input | grep -v monitor
#   pactl set-default-source <source>   (sinon « default » est suivi)
# Sans alsa-utils (pas de arecord), l'app GTK liste aussi les sources PipeWire
# (pactl) dans le sélecteur de micro : choisir une entrée "pulse:..."
# enregistre via ffmpeg -f pulse -i <source>.
# record_cmd = ["ffmpeg", "-loglevel", "error", "-f", "pulse", "-i",
#               "alsa_input.pci-0000_d4_00.6.HiFi__Mic1__source",
#               "-ar", "16000", "-ac", "1", "-f", "s16le", "-"]
# [voice]
# record_cmd = ["arecord", "-q", "-t", "raw", "-f", "S16_LE", "-r", "16000", "-c", "1", "-"]
# play_cmd   = ["ffplay", "-nodisp", "-autoexit", "-loglevel", "quiet"]

# MCP servers stdio : name = commande (list). Préfixe des outils : "<name>__<tool>".
# C'est l'interface stable du projet : les serveurs évoluent, le harnais jamais.

[mcp.servers.nettools]
command = ["uv", "run", "python", "mcp_servers/nettools.py"]

[mcp.servers.cve]
command = ["uv", "run", "python", "mcp_servers/cve.py"]
# API NVD 2.0. Sans clé : 5 req/30s (throttle géré dans le server).
# Clé optionnelle (50 req/30s) : export NVD_API_KEY=... avant de lancer jarvis.

[mcp.servers.sysinfo]
command = ["uv", "run", "python", "mcp_servers/sysinfo.py"]

[mcp.servers.files]
command = ["uv", "run", "python", "mcp_servers/files.py"]
# Lecture confinée aux répertoires de JARVIS_FILES_ROOTS (séparés par ':',
# défaut: cwd + $HOME). Ex: export JARVIS_FILES_ROOTS="$HOME:/srv:/var/log"

[mcp.servers.netutils]
command = ["uv", "run", "python", "mcp_servers/netutils.py"]

[mcp.servers.git]
command = ["uv", "run", "python", "mcp_servers/git.py"]
# Dépôt lu = cwd au lancement, ou JARVIS_GIT_REPO (chemin absolu).

[mcp.servers.memory]
command = ["uv", "run", "python", "mcp_servers/memory.py"]
# Faits persistants dans ~/.cache/jarvis/memory.md
# (surchargeable: export JARVIS_MEMORY_FILE=/chemin/memoire.md)

[mcp.servers.notes]
command = ["uv", "run", "python", "mcp_servers/notes.py"]
# Notes par sujet dans ~/.cache/jarvis/notes/<sujet>.md
# (surchargeable: export JARVIS_NOTES_DIR=/chemin/notes)

[mcp.servers.textutils]
command = ["uv", "run", "python", "mcp_servers/textutils.py"]

# --- Veille sécurité (API publiques) ---

[mcp.servers.kev]
command = ["uv", "run", "python", "mcp_servers/kev.py"]
# Catalogue CISA KEV (exploitées activement), sans clé.

[mcp.servers.epss]
command = ["uv", "run", "python", "mcp_servers/epss.py"]
# Score EPSS (FIRST), sans clé (~300 req/min).
# Token optionnel pour plus de débit: export FIRST_API_KEY=...

[mcp.servers.ghsa]
command = ["uv", "run", "python", "mcp_servers/ghsa.py"]
# Advisories GitHub (REST public). Sans token: 60 req/h.
# Token optionnel (5000 req/h): export GITHUB_TOKEN=ghp_...

[mcp.servers.exploitdb]
command = ["uv", "run", "python", "mcp_servers/exploitdb.py"]
# searchsploit local si installé, sinon API exploit-db.com. Lecture seule.

# --- Réseau avancé / système ---

[mcp.servers.scan]
command = ["uv", "run", "python", "mcp_servers/scan.py"]
# nmap -sT limité au LAN/localhost sauf allow_public=True explicite.

[mcp.servers.snmp]
command = ["uv", "run", "python", "mcp_servers/snmp.py"]
# net-snmp, GET/WALK uniquement. Communauté: paramètre ou JARVIS_SNMP_COMMUNITY.

[mcp.servers.lan]
command = ["uv", "run", "python", "mcp_servers/lan.py"]

[mcp.servers.docker]
command = ["uv", "run", "python", "mcp_servers/docker.py"]
# Lecture seule: ps/stats/logs/images/inspect/system df.

# --- Web ---

[mcp.servers.fetch]
command = ["uv", "run", "python", "mcp_servers/fetch.py"]

[mcp.servers.rss]
command = ["uv", "run", "python", "mcp_servers/rss.py"]

[mcp.servers.echo]
command = ["uv", "run", "python", "mcp_servers/echo.py"]
